name: Build macOS app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build app bundle
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            export APP_VERSION="0.1.0"
          fi
          ./scripts/build-app.sh release

      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist/StopApp.app dist/StopApp-macOS-unsigned.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: StopApp-macOS-unsigned
          path: dist/StopApp-macOS-unsigned.zip
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/StopApp-macOS-unsigned.zip --generate-notes --title "StopApp $GITHUB_REF_NAME"
