name: Build macOS app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      test_version:
        description: "Test version, for example 0.1.4-test.1"
        required: true
        default: "0.1.4-test.1"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Resolve build version
        id: version
        env:
          TEST_VERSION: ${{ inputs.test_version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            PACKAGE_VERSION="${GITHUB_REF_NAME#v}"
            if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tags must use vMAJOR.MINOR.PATCH (for example v0.1.4)." >&2
              exit 1
            fi
            APP_VERSION="$PACKAGE_VERSION"
          else
            PACKAGE_VERSION="$TEST_VERSION"
            if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-test\.[0-9]+$ ]]; then
              echo "Test versions must use MAJOR.MINOR.PATCH-test.N (for example 0.1.4-test.1)." >&2
              exit 1
            fi
            APP_VERSION="${PACKAGE_VERSION%%-test.*}"
          fi

          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build app bundle
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./scripts/build-app.sh release

      - name: Package app
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: ditto -c -k --sequesterRsrc --keepParent dist/StopApp.app "dist/StopApp-macOS-${PACKAGE_VERSION}-unsigned.zip"

      - name: Prepare app artifact
        run: |
          mkdir -p dist/artifact
          ditto dist/StopApp.app dist/artifact/StopApp.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: StopApp-macOS-app-${{ steps.version.outputs.package_version }}
          path: dist/artifact
          if-no-files-found: error

      - name: Publish tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
        run: gh release create "$GITHUB_REF_NAME" "dist/StopApp-macOS-${PACKAGE_VERSION}-unsigned.zip" --generate-notes --title "StopApp $GITHUB_REF_NAME"
